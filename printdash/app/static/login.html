<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>3D-PrintDash – Anmelden</title>
  <link rel="icon" href="static/icon.png" type="image/png">
  <script src="static/i18n.js"></script>
  <script src="static/lang/en.js"></script>
  <link rel="stylesheet" href="static/style.css">
  <style>
    .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    .login { width: min(360px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 26px 24px; display: flex; flex-direction: column; gap: 14px; }
    .login .brand { justify-content: center; font-size: 22px; }
    .login .brand .brand-icon { width: 50px; height: 50px; border-radius: 12px; }
    .login input[type=password] { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; color: var(--text); font-size: 16px; }
    .login .btn { justify-content: center; padding: 10px; font-size: 15px; }
    .login .err { color: var(--bad); font-size: 13px; min-height: 18px; text-align: center; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <form class="login" id="f">
      <div class="brand">
        <svg viewBox="0 0 128 128" class="brand-icon" aria-hidden="true">
        <defs>
          <linearGradient id="pdBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16223a"/><stop offset="1" stop-color="#0a1120"/></linearGradient>
          <linearGradient id="pdCone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f5f9"/><stop offset=".7" stop-color="#e2e8f0" stop-opacity=".9"/><stop offset="1" stop-color="#e2e8f0" stop-opacity=".25"/></linearGradient>
          <radialGradient id="pdGlow"><stop offset="0" stop-color="#ff953a" stop-opacity=".85"/><stop offset="1" stop-color="#ff953a" stop-opacity="0"/></radialGradient>
        </defs>
        <rect width="128" height="128" rx="28" fill="url(#pdBg)"/>
        <path d="M54 41h20l-7.5 16.5h-5z" fill="url(#pdCone)"/>
        <rect x="49" y="24" width="30" height="18" rx="4.5" fill="#f1f5f9"/>
        <g fill="#0f1a2e"><rect x="55.3" y="29" width="2.6" height="9" rx="1.3"/><rect x="62.7" y="29" width="2.6" height="9" rx="1.3"/><rect x="70.1" y="29" width="2.6" height="9" rx="1.3"/></g>
        <circle cx="64" cy="61.5" r="6.5" fill="url(#pdGlow)"/>
        <circle cx="64" cy="61.5" r="2.3" fill="#ff953a"/>
        <g style="fill: var(--accent, #38bdf8)">
          <rect x="46" y="64.5" width="36" height="8" rx="4"/>
          <rect x="41" y="76" width="46" height="8" rx="4"/>
          <rect x="37.5" y="87.5" width="53" height="8" rx="4"/>
        </g>
        <rect x="46" y="64.5" width="36" height="8" rx="4" fill="#fff" opacity=".22"/>
      </svg>
        <span class="brand-name"><span class="brand-acc">3D-</span><span class="brand-mid">Print</span><span class="brand-acc">Dash</span></span>
      </div>
      <input type="password" id="pw" placeholder="Passwort" data-i18n-attr="placeholder" autocomplete="current-password" autofocus required>
      <label class="check"><input type="checkbox" id="remember" checked> <span data-i18n>Angemeldet bleiben (30 Tage)</span></label>
      <button class="btn primary" type="submit" data-i18n>Anmelden</button>
      <div class="err" id="err"></div>
    </form>
  </div>
  <script>
    translateStatic();
    document.getElementById("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector("button");
      const err = document.getElementById("err");
      btn.disabled = true; err.textContent = "";
      try {
        const r = await fetch("api/login", {
          method: "POST", headers: { "Content-Type": "application/json", "X-PF-Lang": LANG },
          body: JSON.stringify({ password: document.getElementById("pw").value,
                                 remember: document.getElementById("remember").checked }),
        });
        if (r.ok) { location.href = "./"; return; }
        let detail = "";
        try { detail = (await r.json()).detail || ""; } catch { /* no body */ }
        err.textContent = r.status === 401 ? t("Falsches Passwort") : (detail || t("Anmeldung fehlgeschlagen"));
      } catch { err.textContent = t("Server nicht erreichbar"); }
      btn.disabled = false;
    });
  </script>
</body>
</html>
