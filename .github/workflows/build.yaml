# Builds the 3D-PrintDash images and publishes them on GitHub (ghcr.io).
#  - printdash-amd64 / printdash-aarch64: used by the Home Assistant app
#  - printdash (both architectures):     used by docker compose
# Runs when something in printdash/ changes, or by hand (Actions → Run workflow).
name: Build images

on:
  push:
    branches: [main]
    paths:
      - "printdash/**"
      - ".github/workflows/build.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version and owner
        id: meta
        run: |
          version=$(grep -E '^version:' printdash/config.yaml | sed -E 's/^version:[[:space:]]*"?([^"]+)"?.*$/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build amd64 image for Home Assistant
        uses: docker/build-push-action@v6
        with:
          context: printdash
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/printdash-amd64:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/printdash-amd64:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=3D-PrintDash
            org.opencontainers.image.licenses=MIT
            io.hass.type=addon
            io.hass.arch=amd64
            io.hass.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: Build aarch64 image for Home Assistant
        uses: docker/build-push-action@v6
        with:
          context: printdash
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/printdash-aarch64:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/printdash-aarch64:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=3D-PrintDash
            org.opencontainers.image.licenses=MIT
            io.hass.type=addon
            io.hass.arch=aarch64
            io.hass.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=aarch64
          cache-to: type=gha,mode=max,scope=aarch64

      - name: Build multi-arch image for docker compose
        uses: docker/build-push-action@v6
        with:
          context: printdash
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/printdash:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/printdash:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=3D-PrintDash
            org.opencontainers.image.licenses=MIT
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=aarch64
